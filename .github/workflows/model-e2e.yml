name: Real model

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  inference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pinned Florence model
        env:
          DSH_VISION_E2E_IMAGE: ${{ github.workspace }}/assets/logo.png
          DSH_VISION_E2E_CACHE: ${{ runner.temp }}/dsh-vision-models
        run: pnpm exec vitest run tests/transformers-backend.e2e.spec.ts --reporter=verbose
